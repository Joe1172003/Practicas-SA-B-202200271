# Overlay para el GKE de la P6. Va DESPUES de P6/values-cloud.yaml y solo
# cambia una cosa: de donde salen las imagenes.
#
# La P6 las bajaba de Artifact Registry porque las subia yo a mano. Ahora las
# publica el pipeline en GHCR, que es lo que pide el enunciado de la P7.
#
# Todo lo demas (recursos, HPA, standard-rwo, el host nip.io) se hereda tal cual
# de values-cloud.yaml, que ya esta probado contra este mismo cluster. Cuanto
# menos cambie un upgrade sobre un release vivo, mejor.
#
# Las etiquetas las pone el pipeline con --set-string.
#
# Requisito: los 7 paquetes de GHCR tienen que ser publicos. El chart no
# declara imagePullSecrets en ningun template, asi que un paquete privado deja
# al kubelet de GKE sin poder descargarlo.

gateway:
  imagen:
    repositorio: ghcr.io/joe1172003/p4-gateway
    politicaDescarga: IfNotPresent

auth:
  imagen:
    repositorio: ghcr.io/joe1172003/p4-auth
    politicaDescarga: IfNotPresent

productos:
  imagen:
    repositorio: ghcr.io/joe1172003/p4-productos
    politicaDescarga: IfNotPresent

ordenes:
  imagen:
    repositorio: ghcr.io/joe1172003/p4-ordenes
    politicaDescarga: IfNotPresent

notificaciones:
  imagen:
    repositorio: ghcr.io/joe1172003/p4-notificaciones
    politicaDescarga: IfNotPresent

cronjobs:
  bitacora:
    imagen:
      repositorio: ghcr.io/joe1172003/p5-cron-bitacora
      politicaDescarga: IfNotPresent
  resumen:
    imagen:
      repositorio: ghcr.io/joe1172003/p5-cron-resumen
      politicaDescarga: IfNotPresent
