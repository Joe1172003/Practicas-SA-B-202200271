# Cluster de un solo nodo para el pipeline. Se crea y se destruye dentro del
# runner de GitHub Actions, asi que no necesita alta disponibilidad.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sa-p7
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
