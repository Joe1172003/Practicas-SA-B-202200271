# Pipeline CI/CD de la Practica 7.
#
# Cuatro etapas encadenadas: build -> test -> dockerizacion -> despliegue.
# Un solo archivo a proposito, para que las cuatro se vean como un solo grafo
# en la pestana Actions.
#
# Que dispara que:
#   pull request  -> build + test              (no publica nada, no despliega)
#   push a main   -> build + test + imagenes + despliegue en un kind efimero
#   tag v*.*.*    -> build + test + imagenes + despliegue en el GKE real
#   ejecucion manual -> igual que un tag, para desplegar cuando yo quiera

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      apagar_al_terminar:
        description: 'Escalar el node pool de GKE a 0 al terminar (ahorro de costo)'
        type: boolean
        default: false

# Una corrida a la vez por rama. En pull requests si se cancela la anterior,
# pero nunca en main ni en un tag: cancelar un helm upgrade a medias deja el
# cluster en un estado raro.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 0. Una sola fuente de verdad para la version que se construye y se despliega
  # ---------------------------------------------------------------------------
  # Sin este job, el job de docker calcularia una etiqueta y el de despliegue
  # otra, y el cluster terminaria pidiendo una imagen que no existe.
  preparacion:
    name: 0 · Preparacion (version)
    runs-on: ubuntu-latest
    outputs:
      etiqueta: ${{ steps.version.outputs.etiqueta }}
      registro: ${{ steps.version.outputs.registro }}
    steps:
      - id: version
        run: |
          # GHCR exige el nombre del dueno en minusculas.
          REGISTRO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ETIQUETA="${GITHUB_REF_NAME#v}"      # v1.0.0 -> 1.0.0
          else
            ETIQUETA="sha-${GITHUB_SHA::7}"      # trazable al commit exacto
          fi

          echo "etiqueta=$ETIQUETA" >> "$GITHUB_OUTPUT"
          echo "registro=$REGISTRO" >> "$GITHUB_OUTPUT"

          echo "### Version de esta corrida: \`$ETIQUETA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Registro: \`$REGISTRO\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 1. BUILD
  # ---------------------------------------------------------------------------
  build-node:
    name: 1 · Build · ${{ matrix.servicio }}
    needs: preparacion
    runs-on: ubuntu-latest
    strategy:
      # Sin fail-fast: si se rompen tres servicios quiero ver los tres errores
      # en la misma corrida, no de a uno.
      fail-fast: false
      matrix:
        servicio: [gateway, auth, productos, ordenes]
    defaults:
      run:
        working-directory: P4/backend-ts/${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # la misma que usa node:22-alpine en el Dockerfile
          cache: npm
          cache-dependency-path: P4/backend-ts/${{ matrix.servicio }}/package-lock.json

      - run: npm ci
      - run: npm run build

  build-python:
    name: 1 · Build · python
    needs: preparacion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11' # la misma que python:3.11-slim

      # compileall y no import: estos modulos leen os.environ al importarse,
      # asi que importarlos sin variables reventaria con KeyError.
      - name: Validar sintaxis de los tres servicios Python
        run: |
          python -m compileall -q \
            P4/notificaciones-py \
            P5/cronjobs/bitacora \
            P5/cronjobs/resumen

  # ---------------------------------------------------------------------------
  # 2. TEST
  # ---------------------------------------------------------------------------
  test-node:
    name: 2 · Test · ${{ matrix.servicio }}
    needs: build-node
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [gateway, auth, productos, ordenes]
    defaults:
      run:
        working-directory: P4/backend-ts/${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: P4/backend-ts/${{ matrix.servicio }}/package-lock.json

      - run: npm ci
      - run: npm test

  test-python:
    name: 2 · Test · python
    needs: build-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Los tres modulos guardan su ejecucion detras de __main__, asi que
      # importarlos con las variables puestas es seguro y comprueba que las
      # dependencias declaradas alcanzan para cargarlos.
      - name: notificaciones · importa
        working-directory: P4/notificaciones-py
        env:
          RABBITMQ_URL: amqp://prueba:prueba@localhost:5672
          DATABASE_URL: postgresql://prueba:prueba@localhost:5432/db
          ARCHIVO_LOG: /tmp/notificaciones.log
          ARCHIVO_LATIDO: /tmp/latido
        run: |
          pip install --quiet -r requirements.txt
          # latido.py queda fuera: es un script standalone que se invoca como
          # healthcheck de Docker, no un modulo pensado para importarse. Al
          # importarlo corre su chequeo de una vez y aborta si no encuentra
          # el archivo de latido, que en el runner nunca va a existir.
          python -c "import main; print('notificaciones importa correctamente')"

      - name: bitacora · importa y lee su carne
        working-directory: P5/cronjobs/bitacora
        env:
          DATABASE_URL: postgresql://prueba:prueba@localhost:5432/db
          CARNE: '202200271'
        run: |
          pip install --quiet -r requirements.txt
          python -c "import main; assert main.CARNE == '202200271'; print('bitacora importa correctamente')"

      - name: resumen · importa
        working-directory: P5/cronjobs/resumen
        env:
          DATABASE_URL: postgresql://prueba:prueba@localhost:5432/db
          RABBITMQ_URL: amqp://prueba:prueba@localhost:5672
          CARNE: '202200271'
        run: |
          pip install --quiet -r requirements.txt
          python -c "import main; print('resumen importa correctamente')"

  # ---------------------------------------------------------------------------
  # 3. DOCKERIZACION
  # ---------------------------------------------------------------------------
  # No corre en pull requests: un PR se valida, no publica.
  docker:
    name: 3 · Imagen · ${{ matrix.imagen }}
    needs: [preparacion, test-node, test-python]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - imagen: p4-gateway
            contexto: P4/backend-ts/gateway
          - imagen: p4-auth
            contexto: P4/backend-ts/auth
          - imagen: p4-productos
            contexto: P4/backend-ts/productos
          - imagen: p4-ordenes
            contexto: P4/backend-ts/ordenes
          # Ojo: notificaciones NO vive bajo backend-ts.
          - imagen: p4-notificaciones
            contexto: P4/notificaciones-py
          - imagen: p5-cron-bitacora
            contexto: P5/cronjobs/bitacora
          - imagen: p5-cron-resumen
            contexto: P5/cronjobs/resumen
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.preparacion.outputs.registro }}/${{ matrix.imagen }}
          tags: |
            type=raw,value=${{ needs.preparacion.outputs.etiqueta }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.imagen }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          # Cada Dockerfile espera como contexto su propia carpeta.
          context: ${{ matrix.contexto }}
          push: true
          # Sin esto GHCR muestra un "unknown/unknown" fantasma junto al paquete.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen }}

  # ---------------------------------------------------------------------------
  # 4a. DESPLIEGUE en un cluster kind efimero (gratis, corre en cada push)
  # ---------------------------------------------------------------------------
  # Este job no usa ni un secreto: las credenciales del cluster desechable se
  # generan al vuelo, asi que no puede fallar por configuracion faltante.
  deploy-kind:
    name: 4 · Despliegue K8s (kind efimero)
    needs: [preparacion, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RELEASE: sa-p7
      NS: sa-p5
      TAG: ${{ needs.preparacion.outputs.etiqueta }}
      REG: ${{ needs.preparacion.outputs.registro }}
    steps:
      - uses: actions/checkout@v4

      - name: Crear el cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: sa-p7
          config: P7/kind/kind-config.yaml
          wait: 120s

      - name: Instalar el Ingress Controller
        run: |
          # El namespace se llama ingress-nginx, que es exactamente lo que ya
          # esperan las NetworkPolicies escritas en la P5.
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx wait --for=condition=ready pod \
            -l app.kubernetes.io/component=controller --timeout=180s

      - name: Precargar las imagenes de terceros
        run: |
          # Docker Hub limita por IP y los runners comparten IP: sin reintentos
          # esto falla cada tanto sin razon.
          for imagen in postgres:15-alpine bitnamilegacy/rabbitmq:4.1.3-debian-12-r1; do
            for intento in 1 2 3; do
              docker pull "docker.io/$imagen" && break || sleep 20
            done
            kind load docker-image "docker.io/$imagen" --name sa-p7
          done

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cargar nuestras 7 imagenes dentro del cluster
        run: |
          # Se bajan con las credenciales del runner y se inyectan al nodo. Asi
          # el kubelet nunca necesita autenticarse contra GHCR, y esto funciona
          # aunque los paquetes todavia sean privados.
          IMAGENES=""
          for nombre in p4-gateway p4-auth p4-productos p4-ordenes \
                        p4-notificaciones p5-cron-bitacora p5-cron-resumen; do
            docker pull "$REG/$nombre:$TAG"
            IMAGENES="$IMAGENES $REG/$nombre:$TAG"
          done
          kind load docker-image --name sa-p7 $IMAGENES

      - name: Resolver las dependencias del chart
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami --force-update
          helm repo update
          # build respeta el Chart.lock; update lo regenera si quedo desfasado.
          helm dependency build ./P5/charts/sa-platform \
            || helm dependency update ./P5/charts/sa-platform

      - name: Generar credenciales desechables
        run: |
          # El cluster se destruye al terminar el job, asi que estas claves
          # viven minutos. La de RabbitMQ se calcula una sola vez porque el
          # chart exige que global.rabbitmq y rabbitmq.auth coincidan.
          CLAVE_RABBIT=$(openssl rand -hex 16)
          cat > "$RUNNER_TEMP/secretos-kind.yaml" <<EOF
          global:
            postgres:
              password: $(openssl rand -hex 16)
            rabbitmq:
              password: ${CLAVE_RABBIT}
            llaves:
              jwtSecret: $(openssl rand -hex 32)
              aesKey: $(openssl rand -base64 32)
              blindIndexKey: $(openssl rand -base64 32)
          rabbitmq:
            auth:
              password: ${CLAVE_RABBIT}
              erlangCookie: $(openssl rand -hex 24)
          EOF

      - name: Validar que el chart renderiza
        run: |
          # Falla en segundos si falta una dependencia o un valor obligatorio,
          # en vez de esperar 15 minutos a que expire el helm upgrade.
          helm template "$RELEASE" ./P5/charts/sa-platform \
            -f ./P7/values-kind.yaml \
            -f "$RUNNER_TEMP/secretos-kind.yaml" \
            --set-string gateway.imagen.etiqueta="$TAG" \
            --set-string auth.imagen.etiqueta="$TAG" \
            --set-string productos.imagen.etiqueta="$TAG" \
            --set-string ordenes.imagen.etiqueta="$TAG" \
            --set-string notificaciones.imagen.etiqueta="$TAG" \
            --set-string cronjobs.bitacora.imagen.etiqueta="$TAG" \
            --set-string cronjobs.resumen.imagen.etiqueta="$TAG" \
            > /dev/null

      - name: Desplegar con Helm
        run: |
          # --set-string y no --set: Helm convierte 1.0 en 1 y el pod terminaria
          # pidiendo una etiqueta que no existe.
          helm upgrade --install "$RELEASE" ./P5/charts/sa-platform \
            -f ./P7/values-kind.yaml \
            -f "$RUNNER_TEMP/secretos-kind.yaml" \
            --set-string gateway.imagen.etiqueta="$TAG" \
            --set-string auth.imagen.etiqueta="$TAG" \
            --set-string productos.imagen.etiqueta="$TAG" \
            --set-string ordenes.imagen.etiqueta="$TAG" \
            --set-string notificaciones.imagen.etiqueta="$TAG" \
            --set-string cronjobs.bitacora.imagen.etiqueta="$TAG" \
            --set-string cronjobs.resumen.imagen.etiqueta="$TAG" \
            --wait --timeout 15m

      - name: Verificar que los pods quedaron listos
        run: |
          kubectl -n "$NS" wait --for=condition=ready pod \
            -l app.kubernetes.io/instance="$RELEASE" --timeout=300s
          kubectl -n "$NS" get pods,svc,pvc,ingress -o wide

      - name: Verificar que el gateway responde por el Ingress
        run: |
          for intento in $(seq 1 30); do
            if curl -fsS -H "Host: sa-p7.local" http://localhost/health > /tmp/salud 2>/dev/null; then
              echo "El gateway responde:"; cat /tmp/salud
              grep -q '"estado":"ok"' /tmp/salud && exit 0
            fi
            sleep 5
          done
          echo "El gateway no respondio por el Ingress"; exit 1

      - name: Diagnostico si algo fallo
        if: failure()
        run: |
          kubectl -n "$NS" get pods -o wide || true
          kubectl -n "$NS" describe pods || true
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -60 || true
          for componente in gateway auth productos ordenes notificaciones; do
            echo "===== $componente ====="
            kubectl -n "$NS" logs "deploy/$RELEASE-$componente" --tail=60 --all-containers || true
          done
          kubectl -n "$NS" logs "sts/$RELEASE-postgres" --tail=60 || true
          kubectl -n "$NS" logs "sts/$RELEASE-rabbitmq" --tail=60 || true

  # ---------------------------------------------------------------------------
  # 4b. DESPLIEGUE en el GKE real (solo con un tag o a mano)
  # ---------------------------------------------------------------------------
  deploy-gke:
    name: 4 · Despliegue K8s (GKE real)
    needs: [preparacion, docker]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: produccion-gke
      url: http://34.59.174.240.nip.io
    concurrency:
      group: gke-sa-p6
      cancel-in-progress: false
    env:
      PROYECTO: sa-p6-202200271
      CLUSTER: sa-p6
      ZONA: us-central1-a
      # Tiene que ser el mismo nombre que instalo la P6, o Helm intentaria
      # instalar de cero encima de lo que ya existe.
      RELEASE: sa-p6
      NS: sa-p5
      TAG: ${{ needs.preparacion.outputs.etiqueta }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROYECTO }}

      - name: Encender los nodos si estan apagados
        run: |
          # El node pool queda en 0 para no pagar cuando no se usa.
          ACTUALES=$(gcloud container clusters describe "$CLUSTER" --zone "$ZONA" \
                       --format="value(currentNodeCount)")
          echo "Nodos encendidos ahora: ${ACTUALES:-0}"
          if [ "${ACTUALES:-0}" -lt 1 ]; then
            echo "Escalando el node pool a 2 nodos..."
            gcloud container clusters resize "$CLUSTER" --node-pool=default-pool \
              --num-nodes=2 --zone "$ZONA" --quiet
          fi

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.ZONA }}

      - run: kubectl wait --for=condition=Ready nodes --all --timeout=300s

      - uses: azure/setup-helm@v4

      - name: Resolver las dependencias del chart
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami --force-update
          helm repo update
          helm dependency build ./P5/charts/sa-platform \
            || helm dependency update ./P5/charts/sa-platform

      - name: Materializar los secretos fuera del repositorio
        env:
          BLOB: ${{ secrets.HELM_VALUES_SECRETOS }}
        run: |
          # Llega en base64 y aterriza en RUNNER_TEMP, que esta fuera del
          # checkout: nunca toca el arbol de git.
          printf '%s' "$BLOB" | base64 -d > "$RUNNER_TEMP/secretos.yaml"
          test -s "$RUNNER_TEMP/secretos.yaml"

      - name: Desplegar con Helm
        run: |
          # Mismos archivos que uso la P6, mas el overlay de GHCR al final para
          # que solo cambie de donde salen las imagenes. Sin -n, igual que la
          # P6: el release vive en el namespace default.
          helm upgrade --install "$RELEASE" ./P5/charts/sa-platform \
            -f ./P5/charts/sa-platform/values-dev.yaml \
            -f ./P6/values-cloud.yaml \
            -f ./P7/values-gke.yaml \
            -f "$RUNNER_TEMP/secretos.yaml" \
            --set-string gateway.imagen.etiqueta="$TAG" \
            --set-string auth.imagen.etiqueta="$TAG" \
            --set-string productos.imagen.etiqueta="$TAG" \
            --set-string ordenes.imagen.etiqueta="$TAG" \
            --set-string notificaciones.imagen.etiqueta="$TAG" \
            --set-string cronjobs.bitacora.imagen.etiqueta="$TAG" \
            --set-string cronjobs.resumen.imagen.etiqueta="$TAG" \
            --wait --timeout 15m

      - name: Borrar el archivo de secretos
        if: always()
        run: rm -f "$RUNNER_TEMP/secretos.yaml"

      - name: Verificar el despliegue
        run: |
          kubectl -n "$NS" rollout status "deploy/$RELEASE-gateway" --timeout=300s
          kubectl -n "$NS" get pods -o wide
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors \
            http://34.59.174.240.nip.io/health

      - name: Diagnostico si algo fallo
        if: failure()
        run: |
          kubectl -n "$NS" get pods -o wide || true
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -40 || true

      - name: Apagar los nodos al terminar
        if: always() && inputs.apagar_al_terminar
        run: |
          gcloud container clusters resize "$CLUSTER" --node-pool=default-pool \
            --num-nodes=0 --zone "$ZONA" --quiet
