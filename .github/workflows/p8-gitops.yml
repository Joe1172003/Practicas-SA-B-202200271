name: P8 GitOps

on:
  # Una version nueva sale de un tag de Git v2.X.Y. La serie 1 es de la P7.
  push:
    tags: ['v2.*.*']
  # En un PR corre todo menos publicar: asi Trivy lo bloquea antes del merge.
  pull_request:
    branches: [main]

# Nada por defecto: cada job pide solo el permiso que usa.
permissions:
  contents: read

concurrency:
  group: p8-${{ github.ref }}
  # En un PR, un push nuevo cancela la corrida vieja. Un tag nunca se cancela.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRO: ghcr.io/joe1172003

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      etiqueta: ${{ steps.calcular.outputs.etiqueta }}
      publicar: ${{ steps.calcular.outputs.publicar }}
    steps:
      - name: Sacar la version del tag
        id: calcular
        env:
          NUMERO_PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # El filtro v2.*.* tambien deja pasar cosas como v2.a.b: aqui exijo SemVer.
            if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v2\.[0-9]+\.[0-9]+$'; then
              echo "::error::El tag $GITHUB_REF_NAME no es SemVer (v2.MENOR.PARCHE)"
              exit 1
            fi
            echo "etiqueta=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            # En un PR la imagen se construye y se analiza, pero no se sube.
            echo "etiqueta=pr-$NUMERO_PR" >> "$GITHUB_OUTPUT"
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0
      - name: Lint de los 8 charts con los valores de cada ambiente
        run: |
          for chart in P8/charts/*/; do
            for ambiente in dev prod; do
              # La etiqueta real la pone el repo GitOps; aqui basta con que exista.
              helm lint "$chart" --strict -f "${chart}values-${ambiente}.yaml" --set-string imagen.etiqueta=0.0.0
            done
          done

  pruebas-node:
    name: Pruebas ${{ matrix.servicio }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        servicio: [gateway, auth, productos, ordenes]
    defaults:
      run:
        working-directory: P4/backend-ts/${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: P4/backend-ts/${{ matrix.servicio }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  pruebas-python:
    name: Pruebas ${{ matrix.carpeta }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        carpeta: [P4/notificaciones-py, P5/cronjobs/bitacora, P5/cronjobs/resumen]
    defaults:
      run:
        working-directory: ${{ matrix.carpeta }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      # Revisa la sintaxis sin ejecutar: estos scripts leen variables de entorno al importarse.
      - run: python -m compileall -q .

  imagenes:
    name: Imagen ${{ matrix.imagen }}
    needs: [version, helm-lint, pruebas-node, pruebas-python]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Para subir la imagen a GHCR.
      packages: write
      # Para firmar sin llave: GitHub le da al job una identidad que Sigstore certifica.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { imagen: p4-gateway, contexto: P4/backend-ts/gateway }
          - { imagen: p4-auth, contexto: P4/backend-ts/auth }
          - { imagen: p4-productos, contexto: P4/backend-ts/productos }
          - { imagen: p4-ordenes, contexto: P4/backend-ts/ordenes }
          - { imagen: p4-notificaciones, contexto: P4/notificaciones-py }
          - { imagen: p5-cron-bitacora, contexto: P5/cronjobs/bitacora }
          - { imagen: p5-cron-resumen, contexto: P5/cronjobs/resumen }
    env:
      ETIQUETA: ${{ needs.version.outputs.etiqueta }}
      PUBLICAR: ${{ needs.version.outputs.publicar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Trivy 0.74.0 verificando su huella
        run: |
          curl -sSfL -o trivy.deb https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.deb
          # La huella sale del archivo de checksums que firma el release oficial de
          # Trivy (lo verifique con cosign verify-blob). Si el paquete cambia, esto falla.
          echo "cf1e32ec8d4d8823e023096a28cadb14f5b5123ce03f201fb633c5b76aa712dd  trivy.deb" | sha256sum -c -
          sudo dpkg -i trivy.deb

      - name: Construir la imagen (todavia no se sube)
        run: |
          echo "REF=$REGISTRO/${{ matrix.imagen }}:$ETIQUETA" >> "$GITHUB_ENV"
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=$GITHUB_SHA \
            --label org.opencontainers.image.version=$ETIQUETA \
            -t "$REGISTRO/${{ matrix.imagen }}:$ETIQUETA" "${{ matrix.contexto }}"
          mkdir -p evidencia

      - name: Reporte de Trivy
        run: |
          trivy image --image-src docker --scanners vuln --severity HIGH,CRITICAL \
            --format table --output evidencia/trivy.txt "$REF"
          cat evidencia/trivy.txt

      - name: SBOM (la lista de todo lo que trae la imagen)
        run: trivy image --image-src docker --format cyclonedx --output evidencia/sbom.cdx.json "$REF"

      # La puerta: con una sola CVE critica el job falla y la imagen nunca sale.
      - name: Puerta de Trivy (bloquea si hay CVE criticas)
        run: trivy image --image-src docker --scanners vuln --severity CRITICAL --exit-code 1 --skip-db-update "$REF"

      - name: Entrar a GHCR
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir la imagen
        if: env.PUBLICAR == 'true'
        run: |
          docker push "$REF"
          # Firmo el digest y no el tag: un tag se puede mover, el digest no.
          DIGEST_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$REF")
          echo "DIGEST_REF=$DIGEST_REF" >> "$GITHUB_ENV"
          echo "$REF@${DIGEST_REF#*@}" > evidencia/imagen.txt

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLICAR == 'true'
        with:
          cosign-release: v3.1.3

      - name: Firmar la imagen y adjuntarle su SBOM
        if: env.PUBLICAR == 'true'
        run: |
          # Sin llave guardada: Sigstore emite un certificado de pocos minutos con
          # la identidad de este workflow y la firma queda en su registro publico.
          cosign sign --yes "$DIGEST_REF"
          cosign attest --yes --type cyclonedx --predicate evidencia/sbom.cdx.json "$DIGEST_REF"

      - name: Verificar la firma (lo mismo que va a exigir Kyverno)
        if: env.PUBLICAR == 'true'
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$DIGEST_REF" 2>&1 | tee evidencia/cosign-verify.txt

      - name: Guardar la evidencia
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidencia-${{ matrix.imagen }}
          path: evidencia/
          if-no-files-found: warn

  # Un solo check que resume todo: es el que exige la regla de la rama main
  # para dejar hacer merge de un PR.
  puerta-de-calidad:
    name: Puerta de calidad
    needs: [version, helm-lint, pruebas-node, pruebas-python, imagenes]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Todas las etapas tienen que estar en verde
        run: |
          echo "version=${{ needs.version.result }}  helm-lint=${{ needs.helm-lint.result }}"
          echo "pruebas-node=${{ needs.pruebas-node.result }}  pruebas-python=${{ needs.pruebas-python.result }}"
          echo "imagenes=${{ needs.imagenes.result }}"
          test "${{ needs.version.result }}" = success
          test "${{ needs.helm-lint.result }}" = success
          test "${{ needs.pruebas-node.result }}" = success
          test "${{ needs.pruebas-python.result }}" = success
          test "${{ needs.imagenes.result }}" = success

  pr-gitops:
    name: PR al repo GitOps
    needs: [version, puerta-de-calidad]
    if: needs.version.outputs.publicar == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Juntar la evidencia de las 7 imagenes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evidencia-*
          path: evidencia

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Joe1172003/sa-p8-gitops
          # El GITHUB_TOKEN solo sirve en este repo. Este token solo puede escribir
          # en sa-p8-gitops, y ni asi toca main: abre un PR que alguien aprueba.
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Cambiar la version y abrir el PR
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          ETIQUETA: ${{ needs.version.outputs.etiqueta }}
        run: |
          rama="version-$ETIQUETA"
          git switch -c "$rama"

          # La imagen de los 6 componentes que construye este pipeline.
          for c in gateway auth productos ordenes notificaciones cronjobs; do
            sed -i "s/^  etiqueta: .*/  etiqueta: \"$ETIQUETA\"/" "valores/$c.yaml"
          done
          # El chart de los 8, fijado al commit exacto de este tag.
          sed -i -E "s/targetRevision: [0-9a-f]{40}.*/targetRevision: $GITHUB_SHA # $GITHUB_REF_NAME/" apps/*.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "version $ETIQUETA"
          git push --force origin "$rama"

          {
            echo "Version $ETIQUETA, generada por el pipeline desde el tag \`$GITHUB_REF_NAME\` (commit $GITHUB_SHA)."
            echo
            echo "Corrida: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Imagenes sin CVE criticas segun Trivy, firmadas con Cosign y con su SBOM adjunto:"
            for f in ../evidencia/*/imagen.txt; do echo "- \`$(cat "$f")\`"; done
            echo
            echo "Cuando se apruebe este PR, ArgoCD despliega la version en sa-p8."
          } > ../cuerpo.md

          # Si se vuelve a correr el mismo tag, el PR ya existe y solo se actualiza la rama.
          if ! gh pr view "$rama" --repo Joe1172003/sa-p8-gitops > /dev/null 2>&1; then
            gh pr create --repo Joe1172003/sa-p8-gitops --base main --head "$rama" \
              --title "Version $ETIQUETA" --body-file ../cuerpo.md
          fi
