# Overlay para GKE. Se aplica encima de values.yaml y values-dev.yaml del chart de mi practica P5,

# Lo que no cambia: el chart entero, las NetworkPolicies, el HPA, los cronjobs,
# el RBAC y los securityContext. Todo eso funciona igual en la nube.

# Host publico. nip.io resuelve cualquier IP.nip.io a esa misma IP, asi que
# da un nombre real sin tener que comprar un dominio.
# La IP sale del Service del ingress-nginx: kubectl get svc -n ingress-nginx
ingress:
  clase: nginx
  host: 34.59.174.240.nip.io

# imagenes y recursos de los microservicios. Se bajan de Artifact Registry de Google Cloud
gateway:
  imagen:
    repositorio: us-central1-docker.pkg.dev/sa-p6-202200271/sa-p6/p4-gateway
    etiqueta: 1.1.0
    politicaDescarga: IfNotPresent
  recursos:
    requests:
      cpu: 15m
      memoria: 96Mi
    limits:
      cpu: 300m
      memoria: 256Mi
  # Umbral 70 y no 30: con requests de 15m, el 30% seria 4.5m y escalaria por nada.
  hpa:
    habilitado: true
    minimo: 1
    maximo: 2
    umbralCpu: 70

