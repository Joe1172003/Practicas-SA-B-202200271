

services:
  postgres:
    image: postgres:15-alpine
    container_name: p4_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - '${POSTGRES_PUERTO_HOST}:5432'
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - red_p4

  # RabbitMQ: el broker de mensajeria (agregado en la P5).
  # Auth y Ordenes dejan mensajes aqui; Notificaciones los saca cuando puede.
  rabbitmq:
    # La etiqueta "management" trae ademas la interfaz web para ver las colas.
    image: rabbitmq:3-management-alpine
    container_name: p4_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USUARIO}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      # 5672 es el protocolo AMQP: por aqui hablan los microservicios.
      - '${RABBITMQ_PUERTO_HOST}:5672'
      # 15672 es la interfaz web: por aqui entras vos con el navegador.
      - '${RABBITMQ_PUERTO_UI}:15672'
    volumes:
      # Sin este volumen, los mensajes de una cola durable se perderian
      # igual al reiniciar el contenedor: la cola es durable en disco, y el
      # disco vive aqui.
      - datos_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      # Pregunta si el broker responde. Los servicios que publican esperan
      # a que esto pase antes de arrancar.
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - red_p4

  #microservicio de autenticacion
  auth:
    build:
      context: ./backend-ts/auth
    container_name: p4_auth
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN}

      DATABASE_URL: ${DATABASE_URL_AUTH}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS}
      JWT_RENEWAL_GRACE_SECONDS: ${JWT_RENEWAL_GRACE_SECONDS}

      COOKIE_NAME: ${COOKIE_NAME}
      COOKIE_SECURE: ${COOKIE_SECURE}

      AES_KEY: ${AES_KEY}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS}

      # Antes era URL_NOTIFICACIONES apuntando al microservicio.
      # Ahora Auth deja el aviso en la cola y no sabe quien lo va a leer.
      RABBITMQ_URL: ${RABBITMQ_URL}
      COLA_NOTIFICACIONES: ${COLA_NOTIFICACIONES}
    ports:
      - '${PUERTO_AUTH}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:3001/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - red_p4

  # microservicio de notificaciones
  #
  # CAMBIO DE LA P5: ya no es un servidor HTTP. Ahora solo escucha la cola.
  # Por eso no tiene "ports": nadie le hace peticiones, el se conecta al broker.
  notificaciones:
    build:
      context: ./notificaciones-py
    container_name: p4_notificaciones
    restart: unless-stopped
    environment:
      ARCHIVO_LOG: /app/logs/notificaciones.log
      RABBITMQ_URL: ${RABBITMQ_URL}
      COLA_NOTIFICACIONES: ${COLA_NOTIFICACIONES}
      DATABASE_URL: ${DATABASE_URL_NOTIFICACIONES}
      ARCHIVO_LATIDO: /tmp/latido
    volumes:
      - ./notificaciones-py/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    # Sin servidor HTTP no hay endpoint que consultar, asi que la salud se
    # mide de otra forma: el consumidor toca un archivo cada vuelta del
    # bucle, y aqui se comprueba que ese archivo sea reciente. Si el proceso
    # se colgo, el archivo se queda viejo y el healthcheck falla.
    healthcheck:
      test: ['CMD', 'python', '/app/latido.py']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - red_p4

  # microservicio de productos
  productos:
    build:
      context: ./backend-ts/productos
    container_name: p4_productos
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL_PRODUCTOS}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE}
    ports:
      - '${PUERTO_PRODUCTOS}:3002'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:3002/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - red_p4

  # microservicio de ordenes
  ordenes:
    build:
      context: ./backend-ts/ordenes
    container_name: p4_ordenes
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3003
      DATABASE_URL: ${DATABASE_URL_ORDENES}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE}

      # La SAGA sigue siendo sincrona: Ordenes espera la respuesta de
      # Productos para saber si hay stock. Eso NO cambia.
      URL_PRODUCTOS: http://productos:3002

      # Lo que si cambia: el aviso de orden pagada o cancelada ahora va
      # a la cola en vez de a una llamada HTTP.
      RABBITMQ_URL: ${RABBITMQ_URL}
      COLA_NOTIFICACIONES: ${COLA_NOTIFICACIONES}
    ports:
      - '${PUERTO_ORDENES}:3003'
    depends_on:
      postgres:
        condition: service_healthy
      productos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:3003/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - red_p4

  # gateway
  gateway:
    build:
      context: ./backend-ts/gateway
    container_name: p4_gateway
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN}

      # URL que usa mi gateway para la comunicacion con mis microservicios.
      # Notificaciones ya no aparece: al ser consumidor puro, el gateway no
      # tiene forma ni motivo de llamarlo.
      URL_AUTH: http://auth:3001
      URL_PRODUCTOS: http://productos:3002
      URL_ORDENES: http://ordenes:3003
    ports:
      - '${PUERTO_GATEWAY}:3000'
    depends_on:
      auth:
        condition: service_healthy
      productos:
        condition: service_healthy
      ordenes:
        condition: service_healthy
    networks:
      - red_p4

# Red propia para que los servicios se llamen entre sí por su nombre
networks:
  red_p4:
    driver: bridge

volumes:
  datos_postgres:
  datos_rabbitmq:
