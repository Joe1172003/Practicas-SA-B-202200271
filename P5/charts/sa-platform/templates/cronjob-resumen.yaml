{{- $ctx := dict "raiz" . "componente" "resumen" -}}
# Cronjob 2: cada 10 minutos agrupa la bitacora por hora y publica el resumen en la cola.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sa-platform.nombre" $ctx }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sa-platform.etiquetas" $ctx | nindent 4 }}
spec:
  schedule: {{ .Values.cronjobs.resumen.horario | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cronjobs.historialExito }}
  failedJobsHistoryLimit: {{ .Values.cronjobs.historialFallo }}
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjobs.reintentos }}
      template:
        metadata:
          labels:
            {{- include "sa-platform.selector" $ctx | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "sa-platform.nombre" $ctx }}
          securityContext:
            {{- include "sa-platform.seguridadPod" (dict "uid" 10003) | nindent 12 }}
          containers:
            - name: resumen
              image: "{{ .Values.cronjobs.resumen.imagen.repositorio }}:{{ .Values.cronjobs.resumen.imagen.etiqueta }}"
              imagePullPolicy: {{ .Values.cronjobs.resumen.imagen.politicaDescarga | default "IfNotPresent" }}
              securityContext:
                {{- include "sa-platform.seguridadContenedor" . | nindent 16 }}
              env:
                - name: CARNE
                  value: {{ .Values.cronjobs.carne | quote }}
                - name: COLA_NOTIFICACIONES
                  value: {{ .Values.global.configuracion.COLA_NOTIFICACIONES | quote }}
              envFrom:
                # A diferencia del cronjob 1, este ademas necesita el broker.
                - secretRef:
                    name: {{ include "sa-platform.nombre" $ctx }}-secreto
              resources:
                requests:
                  cpu: {{ .Values.cronjobs.recursos.requests.cpu | quote }}
                  memory: {{ .Values.cronjobs.recursos.requests.memoria | quote }}
                limits:
                  cpu: {{ .Values.cronjobs.recursos.limits.cpu | quote }}
                  memory: {{ .Values.cronjobs.recursos.limits.memoria | quote }}
