{{- $ctx := dict "raiz" . "componente" "notificaciones" "baseDatos" .Values.baseDatos -}}
# Unico componente sin Service ni containerPort: nadie lo llama, el saca los mensajes de la cola.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sa-platform.nombre" $ctx }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sa-platform.etiquetas" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  strategy:
    {{- include "sa-platform.rollingUpdate" . | nindent 4 }}
  selector:
    matchLabels:
      {{- include "sa-platform.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sa-platform.selector" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include "sa-platform.checksumConfig" $ctx }}
    spec:
      containers:
        - name: notificaciones
          image: "{{ .Values.imagen.repositorio }}:{{ .Values.imagen.etiqueta }}"
          imagePullPolicy: {{ .Values.imagen.politicaDescarga | default "IfNotPresent" }}
          envFrom:
            - configMapRef:
                name: {{ include "sa-platform.configMap" $ctx }}
            - secretRef:
                name: {{ include "sa-platform.nombre" $ctx }}-secreto
          env:
            - name: ARCHIVO_LOG
              value: {{ .Values.archivoLog | quote }}
            # El consumidor lo toca en cada vuelta del bucle: sin servidor HTTP, la probe se hara con exec sobre este archivo.
            - name: ARCHIVO_LATIDO
              value: {{ .Values.archivoLatido | quote }}
          # Probes por exec y no por httpGet: sin servidor HTTP no hay endpoint /health que consultar.
          # latido.py sale con codigo 0 si el archivo es reciente y 1 si no.
          startupProbe:
            exec:
              command: ["python", "/app/latido.py"]
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            exec:
              command: ["python", "/app/latido.py"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "/app/latido.py"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: {{ .Values.archivoLog | dir }}
            - name: temporal
              mountPath: {{ .Values.archivoLatido | dir }}
          resources:
            requests:
              cpu: {{ .Values.recursos.requests.cpu | quote }}
              memory: {{ .Values.recursos.requests.memoria | quote }}
            limits:
              cpu: {{ .Values.recursos.limits.cpu | quote }}
              memory: {{ .Values.recursos.limits.memoria | quote }}
      volumes:
        # emptyDir nace y muere con el Pod. Seran los unicos puntos escribibles cuando el sistema de archivos pase a solo lectura.
        - name: logs
          emptyDir: {}
        - name: temporal
          emptyDir: {}
