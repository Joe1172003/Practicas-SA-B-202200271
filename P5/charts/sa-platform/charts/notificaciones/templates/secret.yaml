{{- $ctx := dict "raiz" . "componente" "notificaciones" "baseDatos" .Values.baseDatos -}}
# La cola para leer y su base para guardar lo que leyo. Nada mas.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-platform.nombre" $ctx }}-secreto
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sa-platform.etiquetas" $ctx | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "sa-platform.urlPostgres" $ctx | quote }}
  RABBITMQ_URL: {{ include "sa-platform.urlRabbit" $ctx | quote }}
