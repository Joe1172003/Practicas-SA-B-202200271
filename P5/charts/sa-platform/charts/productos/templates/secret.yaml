{{- $ctx := dict "raiz" . "componente" "productos" "baseDatos" .Values.baseDatos -}}
# Una sola clave: Productos solo habla con su base, no firma tokens ni publica en la cola.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-platform.nombre" $ctx }}-secreto
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sa-platform.etiquetas" $ctx | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "sa-platform.urlPostgres" $ctx | quote }}
