{{- $ctx := dict "raiz" . "componente" "auth" "baseDatos" .Values.baseDatos -}}
# Secret propio: si todos compartieran uno, Productos cargaria la llave AES de Auth sin necesitarla.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-platform.nombre" $ctx }}-secreto
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sa-platform.etiquetas" $ctx | nindent 4 }}
type: Opaque
# stringData recibe texto plano y Kubernetes lo codifica al guardarlo; se lee mejor que data con base64.
stringData:
  DATABASE_URL: {{ include "sa-platform.urlPostgres" $ctx | quote }}
  RABBITMQ_URL: {{ include "sa-platform.urlRabbit" $ctx | quote }}

  # required falla al instalar; sin el, el Secret quedaria con la llave vacia y el error saldria en el primer login.
  JWT_SECRET: {{ required "Falta global.llaves.jwtSecret: pasalo con -f values.secretos.yaml" .Values.global.llaves.jwtSecret | quote }}
  AES_KEY: {{ required "Falta global.llaves.aesKey: pasalo con -f values.secretos.yaml" .Values.global.llaves.aesKey | quote }}
  BLIND_INDEX_KEY: {{ required "Falta global.llaves.blindIndexKey: pasalo con -f values.secretos.yaml" .Values.global.llaves.blindIndexKey | quote }}
