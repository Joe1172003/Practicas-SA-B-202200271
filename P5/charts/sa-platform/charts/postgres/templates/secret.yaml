{{- $ctx := dict "raiz" . "componente" "postgres" -}}
# Sale de global.postgres, las mismas piezas con las que cada microservicio arma su DATABASE_URL.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-platform.nombre" $ctx }}-secreto
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sa-platform.etiquetas" $ctx | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ required "Falta global.postgres.usuario en values.yaml" .Values.global.postgres.usuario | quote }}
  POSTGRES_PASSWORD: {{ required "Falta global.postgres.password: pasalo con -f values.secretos.yaml" .Values.global.postgres.password | quote }}
