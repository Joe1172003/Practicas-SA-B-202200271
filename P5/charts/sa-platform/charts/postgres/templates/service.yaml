{{- $ctx := dict "raiz" . "componente" "postgres" -}}
# El que usan los microservicios. A diferencia del headless, respeta la readiness y no enruta a una base que aun arranca.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sa-platform.nombre" $ctx }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sa-platform.etiquetas" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sa-platform.selector" $ctx | nindent 4 }}
  ports:
    - port: {{ .Values.puerto }}
      targetPort: postgres
      protocol: TCP
