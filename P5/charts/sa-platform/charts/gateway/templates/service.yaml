{{- $ctx := dict "raiz" . "componente" "gateway" -}}
# Lleva Service porque el Ingress necesita un nombre estable al que enviar el trafico de afuera.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sa-platform.nombre" $ctx }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sa-platform.etiquetas" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sa-platform.selector" $ctx | nindent 4 }}
  ports:
    - port: {{ .Values.puerto }}
      targetPort: {{ .Values.puerto }}
      protocol: TCP
