# Valores por defecto del subchart. El padre los sobreescribe desde su bloque "gateway".
replicas: 1
imagen:
  repositorio: p4-gateway
  etiqueta: 1.1.0
  # Never obliga a usar la imagen ya cargada en minikube: en Docker Hub no existe.
  politicaDescarga: Never
puerto: 3000
recursos:
  requests:
    cpu: 50m
    memoria: 96Mi
  limits:
    cpu: 300m
    memoria: 256Mi

# minimo 1 y no 2 porque en un nodo con 4GB dos replicas fijas de cada componente no caben.
# umbral 30 y no 70 para que el escalado se dispare y sea demostrable con una carga moderada.
hpa:
  habilitado: true
  minimo: 1
  maximo: 3
  umbralCpu: 30

# Con una sola replica bloquea el drenado del nodo, pero en minikube no se drena nunca.
pdb:
  habilitado: true
  minimoDisponible: 1
