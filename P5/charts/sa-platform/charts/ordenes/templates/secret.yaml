{{- $ctx := dict "raiz" . "componente" "ordenes" "baseDatos" .Values.baseDatos -}}
# Su base y el broker, pero ninguna llave de cifrado: Ordenes no maneja datos personales.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-platform.nombre" $ctx }}-secreto
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sa-platform.etiquetas" $ctx | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "sa-platform.urlPostgres" $ctx | quote }}
  RABBITMQ_URL: {{ include "sa-platform.urlRabbit" $ctx | quote }}
