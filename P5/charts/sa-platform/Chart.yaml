apiVersion: v2
name: sa-platform
description: Plataforma de microservicios de la practica 5
type: application

# version es la del empaquetado y appVersion la de la aplicacion: se incrementan por separado.
version: 0.4.0
appVersion: "1.2.0"

# repository vacio significa que el subchart ya vive en la carpeta charts/ y no hay que descargarlo.
dependencies:
  - name: gateway
    version: 0.1.0
    repository: ""
  - name: auth
    version: 0.1.0
    repository: ""
  - name: productos
    version: 0.1.0
    repository: ""
  - name: ordenes
    version: 0.1.0
    repository: ""
  - name: notificaciones
    version: 0.1.0
    repository: ""
  - name: postgres
    version: 0.1.0
    repository: ""

  # Unica dependencia externa: helm dependency update la baja de Bitnami como .tgz.
  - name: rabbitmq
    version: 16.0.14
    repository: https://charts.bitnami.com/bitnami

icon: https://helm.sh/img/helm.svg
