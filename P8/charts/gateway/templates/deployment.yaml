{{- if not .Values.canary.habilitado }}
# Solo en dev (minikube), donde no esta Argo Rollouts: reemplazo comun, todo de
# una vez. En prod el gateway es un Rollout (rollout.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sa.etiquetas" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.habilitado }}
  # Con HPA no se fija replicas: cada sincronizacion lo devolveria a este valor.
  replicas: {{ .Values.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # El Pod nuevo tiene que estar listo antes de bajar el viejo: sin caida.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "sa.selector" . | nindent 6 }}
  template:
    {{- include "gateway.plantillaPod" . | nindent 4 }}
{{- end }}
