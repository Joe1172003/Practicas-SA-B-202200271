{{- if .Values.canary.habilitado }}
# El gateway en prod. Es un Deployment con otra forma de reemplazar los Pods:
# la version nueva recibe primero una parte del trafico real, y solo avanza si
# sus metricas en Prometheus se ven bien. Si empeoran, Argo Rollouts vuelve solo
# a la estable.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sa.etiquetas" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.habilitado }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "sa.selector" . | nindent 6 }}
  template:
    {{- include "gateway.plantillaPod" . | nindent 4 }}
  strategy:
    canary:
      # Dos Services con el mismo selector: Argo Rollouts le agrega a cada uno la
      # version que le toca, asi gateway-canary apunta solo a la nueva.
      stableService: {{ .Chart.Name }}
      canaryService: {{ .Chart.Name }}-canary
      # El porcentaje exacto lo reparte ingress-nginx: Argo Rollouts crea un
      # Ingress canary con el peso de cada paso.
      trafficRouting:
        nginx:
          stableIngress: {{ .Chart.Name }}
      # P10: el canary ya no corre pruebas propias. Mientras la version nueva
      # atiende trafico real, un analisis de fondo le pregunta a Prometheus cada
      # 30 s por sus errores y su latencia. Al primer veredicto malo se revierte,
      # sin esperar al final de los pasos.
      analysis:
        templates:
          - templateName: {{ .Values.canary.analisis }}
        # Empieza en cuanto la version nueva recibe su primer porcentaje.
        startingStep: 1
        args:
          # El hash del ReplicaSet va en el nombre de cada Pod, y Prometheus guarda
          # ese nombre en k8s_pod_name. Con eso separa candidata y estable exacto.
          - name: hash-candidata
            valueFrom:
              podTemplateHashValue: Latest
          - name: hash-estable
            valueFrom:
              podTemplateHashValue: Stable
      steps:
        {{- range .Values.canary.pesos }}
        - setWeight: {{ . }}
        - pause:
            duration: {{ $.Values.canary.pausa }}
        {{- end }}
{{- end }}
