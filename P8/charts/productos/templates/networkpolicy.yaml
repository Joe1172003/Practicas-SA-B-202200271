# Quien puede entrarle a productos: el gateway, y ordenes, que le pide apartar
# stock durante la saga. Es la unica llamada directa entre servicios.
# La base de denegar todo la pone Terraform.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entrada-{{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sa.etiquetas" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sa.selector" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ordenes
      ports:
        - protocol: TCP
          port: {{ .Values.puerto }}
