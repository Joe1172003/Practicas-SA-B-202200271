# Quien puede entrarle a la base: los cuatro servicios con datos propios y los
# dos cronjobs. El gateway no esta porque nunca consulta la base.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entrada-{{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sa.etiquetas" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sa.selector" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range list "auth" "productos" "ordenes" "notificaciones" "bitacora" "resumen" }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.puerto }}
