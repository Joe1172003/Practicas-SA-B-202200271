# Quien puede entrarle a auth: solo el gateway, que es el que recibe al cliente.
# La base de denegar todo la pone Terraform.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entrada-{{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sa.etiquetas" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sa.selector" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - protocol: TCP
          port: {{ .Values.puerto }}
