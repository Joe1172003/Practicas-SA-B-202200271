{{- if .Values.hpa.habilitado }}
# Ajusta las replicas segun el uso de CPU, medido sobre requests.cpu.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sa.etiquetas" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Chart.Name }}
  minReplicas: {{ .Values.hpa.minimo }}
  maxReplicas: {{ .Values.hpa.maximo }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.umbralCpu }}
  behavior:
    scaleDown:
      # 60s de calma antes de achicar, para no subir y bajar en ciclo con picos cortos.
      stabilizationWindowSeconds: 60
{{- end }}
